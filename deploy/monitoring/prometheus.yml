global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: ilm-liga
    environment: production

rule_files:
  - /etc/prometheus/rules/ilm-liga-alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: ilm-liga-app
    scheme: http
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ilm-liga-metrics-token
    static_configs:
      - targets:
          - 127.0.0.1:3000
        labels:
          instance: ilm-liga-production
