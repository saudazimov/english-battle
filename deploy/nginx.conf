# ============================================================================
# nginx.conf — IlmLiga reverse proxy (single-instance VPS)
# ============================================================================
# Joylashuv: /etc/nginx/sites-available/englishbattle
# Yoqish:    ln -s /etc/nginx/sites-available/englishbattle /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#
# MUHIM: IlmLiga same-origin monolit — frontend (static) + API + Socket.IO
#        HAMMASI bitta Node service'da (127.0.0.1:3000). Nginx faqat proxy.
#        Frontend ALOHIDA hosting (Vercel) ga ajratilmaydi.
#
# SSL: pastda certbot bilan avtomatik qo'shiladi (qo'llanmaga qarang).
# ============================================================================

# Domenni o'zingiznikiga almashtiring
server {
    listen 80;
    listen [::]:80;
    server_name ilmliga.uz www.ilmliga.uz;

    # HTTP → HTTPS redirect (certbot SSL qo'shgach yoqiladi).
    # Certbot o'zi bu blokni to'ldiradi. Dastlab HTTP'da test qilsangiz,
    # certbot ishlatilgunча quyidagi location bloklari ishlaydi.

    # Fayl yuklash hajmi — server.js multer limiti (resurs 20MB) bilan mos.
    # Nginx default 1MB, shuning uchun oshiramiz (aks holda 413 xatosi).
    client_max_body_size 25M;

    # Private metrics internetga proxy qilinmaydi. Local collector endpointni
    # http://127.0.0.1:3000/internal/metrics orqali Bearer token bilan scrape qiladi.
    location = /internal/metrics {
        return 404;
    }

    # ===== Socket.IO / WebSocket =====
    # KRITIK: WebSocket upgrade headerlari bo'lmasa — live battle ulanmaydi.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket uzoq ulanish — timeout'ni oshiramiz (jang davomida uzilmasin)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== API + static frontend (hammasi Node'da) =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For — server.js trust proxy shuni o'qiydi (TRUST_PROXY_HOPS=1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Health check'lar uchun log shovqinini kamaytirish (ixtiyoriy)
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
