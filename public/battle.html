<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Battle — Jang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.12), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12), transparent 40%);
      min-height: 100vh;
      color: #e2e8f0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container { max-width: 700px; width: 100%; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ===== QIDIRISH EKRANI ===== */
    .searching {
      text-align: center;
      padding: 60px 20px;
    }

    .searching h2 {
      font-size: 28px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .spinner {
      width: 80px;
      height: 80px;
      margin: 30px auto;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse {
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5); }

    .btn-secondary {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    /* ===== JANG EKRANI ===== */
    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .player-box {
      flex: 1;
      background: rgba(20, 20, 40, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .player-box.opponent {
      border-color: rgba(239, 68, 68, 0.3);
    }

    .player-box .pname { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .player-box .pscore {
      font-size: 24px;
      font-weight: bold;
      color: #818cf8;
    }
    .player-box.opponent .pscore { color: #f87171; }

    .vs {
      font-size: 20px;
      font-weight: bold;
      color: #64748b;
    }

    /* Taymer */
    .timer-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      width: 100%;
      transition: width 1s linear;
    }

    .timer-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    /* Savol */
    .question-card {
      background: rgba(20, 20, 40, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.15);
    }

    .q-number {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .q-text {
      font-size: 22px;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 12px 0;
      padding: 18px 20px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 14px;
      color: #e2e8f0;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: #818cf8;
      transform: translateX(4px);
    }

    .option .letter {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      margin-right: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    /* ===== NATIJA EKRANI ===== */
    .result {
      text-align: center;
      padding: 40px 20px;
    }

    .result-icon { font-size: 80px; margin-bottom: 16px; }

    .result h1 {
      font-size: 42px;
      margin-bottom: 30px;
    }

    .result h1.win {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result h1.lose { color: #64748b; }
    .result h1.draw { color: #818cf8; }

    .result-scores {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
    }

    .result-score .num { font-size: 48px; font-weight: bold; }
    .result-score.you .num { color: #818cf8; }
    .result-score.opp .num { color: #f87171; }
    .result-score .lbl { font-size: 13px; color: #64748b; margin-top: 4px; }

    .xp-earned {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 12px;
      color: #86efac;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .opponent-progress {
      text-align: center;
      color: #f87171;
      font-size: 14px;
      margin-top: 16px;
      min-height: 20px;
    }

    /* ===== ANIMATSIYALAR ===== */
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes resultPop {
      0% { opacity: 0; transform: scale(0.7); }
      60% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Savol kartasi har safar silliq paydo bo'ladi */
    .question-card { animation: fadeInScale 0.3s ease; }

    /* Variantlar ketma-ket paydo bo'ladi */
    .option { animation: slideInRight 0.3s ease both; }
    .option:nth-child(1) { animation-delay: 0.05s; }
    .option:nth-child(2) { animation-delay: 0.1s; }
    .option:nth-child(3) { animation-delay: 0.15s; }
    .option:nth-child(4) { animation-delay: 0.2s; }

    /* Variant bosilganda */
    .option { transition: transform 0.15s ease, background 0.2s ease; }
    .option:active { transform: scale(0.98); }

    /* Natija ekrani porlab chiqadi */
    #resultScreen.active .result { animation: resultPop 0.5s ease; }
    .result-icon { animation: resultPop 0.6s ease; }

    /* Konfetti */
    .confetti-piece {
      position: fixed;
      top: 0;
      width: 12px;
      height: 12px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

  </style>
</head>
<body>
  <div class="container">

    <!-- QIDIRISH EKRANI -->
    <div class="screen active" id="searchScreen">
      <div class="searching">
        <h2 id="searchTitle">Raqib qidirilmoqda</h2>
        <div class="spinner"></div>
        <p class="pulse" id="searchText">Sizga teng raqib izlanmoqda...</p>
        <br>
        <button class="btn btn-secondary" onclick="goLobby()">Bekor qilish</button>
      </div>
    </div>

    <!-- JANG EKRANI -->
    <div class="screen" id="battleScreen">
      <div class="battle-header">
        <div class="player-box">
          <div class="pname" id="myName">Siz</div>
          <div class="pscore" id="myScore">0</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-box opponent">
          <div class="pname" id="oppName">Raqib</div>
          <div class="pscore" id="oppScore">0</div>
        </div>
      </div>

      <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
      </div>

      <div class="question-card">
        <div class="q-number" id="qNumber">Savol 1 / 5</div>
        <div class="q-text" id="qText">...</div>
        <div id="options"></div>
      </div>

      <div class="opponent-progress" id="oppProgress"></div>
    </div>

    <!-- NATIJA EKRANI -->
    <div class="screen" id="resultScreen">
      <div class="result">
        <div class="result-icon" id="resultIcon">🏆</div>
        <h1 id="resultTitle">G'alaba!</h1>
        <div class="result-scores">
          <div class="result-score you">
            <div class="num" id="finalMyScore">0</div>
            <div class="lbl">SIZ</div>
          </div>
          <div class="result-score opp">
            <div class="num" id="finalOppScore">0</div>
            <div class="lbl">RAQIB</div>
          </div>
        </div>
        <div class="xp-earned" id="xpEarned">+0 XP</div>
        <div class="result-actions">
          <button class="btn" onclick="showMistakes()">📖 Xatolarni ko'rish</button>
          <button class="btn" onclick="playAgain()">Yana o'ynash</button>
          <button class="btn btn-secondary" onclick="goLobby()">Lobbyga</button>
        </div>
      </div>
    </div>
    <!-- XATOLAR EKRANI -->
    <div class="screen" id="mistakesScreen">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:24px; background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">📖 Javoblar tahlili</h2>
        <button class="btn btn-secondary" onclick="backToResult()">← Orqaga</button>
      </div>
      <div id="mistakesList"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/leagues.js"></script>

  <script>
    // Login tekshirish
    const userData = localStorage.getItem("user");
    if (!userData) window.location.href = "/index.html";
    const user = JSON.parse(userData);

    const socket = io();
    let currentRoom = null;
    let questions = [];
    let currentIndex = 0;
    let myScore = 0;
    let timerInterval = null;

    // Ekranlarni almashtirish
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // Sahifa ochilishi bilan jang qidirishni boshlash
    socket.on("connect", () => {
      socket.emit("findMatch", {
        userId: user.id,
        name: user.first_name,
        level: user.cefr_level,
      });
    });

    socket.on("waiting", (data) => {
      document.getElementById("searchText").textContent = data.message;
    });

    socket.on("matchFound", (data) => {
      currentRoom = data.roomId;
      document.getElementById("searchTitle").textContent = "Raqib topildi!";
      document.getElementById("searchText").textContent =
        data.opponent.name + " bilan jang boshlanmoqda...";
      document.getElementById("oppName").textContent = data.opponent.name;
    });

    socket.on("battleStart", (data) => {
      questions = data.questions;
      currentIndex = 0;
      myScore = 0;
      document.getElementById("myName").textContent = user.first_name;
      document.getElementById("myScore").textContent = "0";
      document.getElementById("oppScore").textContent = "0";
      showScreen("battleScreen");
      showQuestion();
    });

    function showQuestion() {
      if (currentIndex >= questions.length) {
        clearInterval(timerInterval);
        document.getElementById("qText").textContent = "Tugatdingiz! Raqib kutilmoqda...";
        document.getElementById("options").innerHTML = "";
        document.getElementById("qNumber").textContent = "";
        return;
      }

      const q = questions[currentIndex];
      document.getElementById("qNumber").textContent =
        "Savol " + (currentIndex + 1) + " / " + questions.length;
      document.getElementById("qText").textContent = q.question_text;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      ["A", "B", "C", "D"].forEach((letter) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = '<span class="letter">' + letter + '</span>' +
          q["option_" + letter.toLowerCase()];
        btn.onclick = () => answer(letter);
        optionsDiv.appendChild(btn);
      });

      startTimer();
    }

    // Har savol uchun 15 soniya taymer
    function startTimer() {
      clearInterval(timerInterval);
      let timeLeft = 15;
      const fill = document.getElementById("timerFill");
      fill.classList.remove("warning");
      fill.style.width = "100%";

      timerInterval = setInterval(() => {
        timeLeft--;
        const percent = (timeLeft / 15) * 100;
        fill.style.width = percent + "%";

        if (timeLeft <= 5) fill.classList.add("warning");

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // Vaqt tugadi — javobsiz keyingisiga o'tish
          answer(null);
        }
      }, 1000);
    }

    function answer(letter) {
      clearInterval(timerInterval);
      const q = questions[currentIndex];

      socket.emit("submitAnswer", {
        roomId: currentRoom,
        questionId: q.id,
        answer: letter,
      });

      currentIndex++;
      showQuestion();
    }

    socket.on("opponentProgress", (data) => {
      document.getElementById("oppProgress").textContent =
        "🔴 Raqib " + data.answeredCount + " ta savolga javob berdi";
    });

    socket.on("battleEnd", (data) => {
      clearInterval(timerInterval);
      
      // Javoblarni saqlash (xatolar tahlili uchun)
      window.battleAnswers = data.answers || [];

      // Ballarni sanab o'stirish
      animateScore("finalMyScore", data.your_score, 800);
      animateScore("finalOppScore", data.opponent_score, 800);
      document.getElementById("xpEarned").textContent = "+" + data.xp_earned + " XP";
      // Liga o'zgarishi xabari
      if (data.league_change) {
        const lc = data.league_change;
        const oldL = getLeagueByName(lc.old);
        const newL = getLeagueByName(lc.new);

        const banner = document.createElement("div");
        if (lc.promoted) {
          banner.style.cssText = "margin:16px auto; padding:16px 24px; background:linear-gradient(135deg, rgba(251,191,36,0.2), rgba(168,85,247,0.2)); border:2px solid #fbbf24; border-radius:14px; text-align:center; max-width:400px;";
          banner.innerHTML = '<div style="font-size:22px; font-weight:bold; color:#fbbf24; margin-bottom:6px;">🎉 Liga ko\'tarildi!</div>' +
            '<div style="font-size:16px;"><span style="color:' + oldL.color + ';">' + oldL.emoji + ' ' + oldL.name + '</span> → <span style="color:' + newL.color + '; font-weight:bold;">' + newL.emoji + ' ' + newL.name + '</span></div>';
        } else {
          banner.style.cssText = "margin:16px auto; padding:16px 24px; background:rgba(239,68,68,0.15); border:2px solid rgba(239,68,68,0.4); border-radius:14px; text-align:center; max-width:400px;";
          banner.innerHTML = '<div style="font-size:18px; font-weight:bold; color:#f87171; margin-bottom:6px;">📉 Liga tushdi</div>' +
            '<div style="font-size:16px;"><span style="color:' + oldL.color + ';">' + oldL.emoji + ' ' + oldL.name + '</span> → <span style="color:' + newL.color + ';">' + newL.emoji + ' ' + newL.name + '</span></div>';
        }

        // Natija ekraniga qo'shish (xpEarned dan keyin)
        const xpEl = document.getElementById("xpEarned");
        xpEl.parentNode.insertBefore(banner, xpEl.nextSibling);
      }
      // Yangilangan foydalanuvchini saqlash
      if (data.updated_user) {
        localStorage.setItem("user", JSON.stringify(data.updated_user));
      }

      // Reyting o'zgarishini ko'rsatish
      const xpEl = document.getElementById("xpEarned");
      let ratingText = "";
      if (data.rating_change > 0) ratingText = " · +" + data.rating_change + " reyting";
      else if (data.rating_change < 0) ratingText = " · " + data.rating_change + " reyting";
      xpEl.textContent = "+" + data.xp_earned + " XP" + ratingText;
      const title = document.getElementById("resultTitle");
      const icon = document.getElementById("resultIcon");

      if (data.outcome === "win") {
        title.textContent = "G'alaba!";
        title.className = "win";
        icon.textContent = "🏆";
        setTimeout(launchConfetti, 300); // g'alabada konfetti!

      } else if (data.outcome === "lose") {
        title.textContent = "Mag'lubiyat";
        title.className = "lose";
        icon.textContent = "😔";
      } else {
        title.textContent = "Durrang!";
        title.className = "draw";
        icon.textContent = "🤝";
      }

      showScreen("resultScreen");
    });

    function playAgain() {
      window.location.reload();
    }

    function goLobby() {
      window.location.href = "/lobby.html";
    }

    // ===== XATOLAR TAHLILI =====
    function showScreenById(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showMistakes() {
      const answers = window.battleAnswers || [];
      const list = document.getElementById("mistakesList");

      if (answers.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#64748b; padding:40px;">Ma\'lumot yo\'q</div>';
      } else {
        list.innerHTML = "";
        answers.forEach((a, index) => {
          const card = document.createElement("div");
          const borderColor = a.is_correct ? "#22c55e" : "#ef4444";
          card.style.cssText = "background:rgba(20,20,40,0.8); border:1px solid rgba(99,102,241,0.3); border-left:4px solid " + borderColor + "; border-radius:14px; padding:18px; margin-bottom:14px;";

          // Har variant uchun rang
          let optionsHtml = "";
          ["A", "B", "C", "D"].forEach(letter => {
            const text = a["option_" + letter.toLowerCase()];
            let style = "padding:8px 12px; border-radius:8px; margin:4px 0; font-size:14px;";
            if (letter === a.correct_answer) {
              style += "background:rgba(34,197,94,0.2); color:#86efac; font-weight:600;"; // to'g'ri javob yashil
            } else if (letter === a.your_answer && !a.is_correct) {
              style += "background:rgba(239,68,68,0.2); color:#fca5a5;"; // xato javob qizil
            } else {
              style += "color:#94a3b8;";
            }
            optionsHtml += '<div style="' + style + '">' + letter + ') ' + text + '</div>';
          });

          const statusIcon = a.is_correct ? "✅" : "❌";
          const yourAnswerText = a.your_answer ? a.your_answer : "javob berilmadi";

          card.innerHTML =
            '<div style="font-weight:600; font-size:16px; margin-bottom:10px;">' + statusIcon + ' Savol ' + (index + 1) + ': ' + a.question_text + '</div>' +
            optionsHtml +
            '<div style="font-size:13px; color:#94a3b8; margin-top:8px;">Sizning javobingiz: <b>' + yourAnswerText + '</b> · To\'g\'ri: <b style="color:#86efac;">' + a.correct_answer + '</b></div>' +
            (a.explanation ? '<div style="font-size:13px; color:#a5b4fc; margin-top:8px; padding:10px; background:rgba(99,102,241,0.1); border-radius:8px;">💡 ' + a.explanation + '</div>' : '');

          list.appendChild(card);
        });
      }

      showScreenById("mistakesScreen");
    }

    function backToResult() {
      showScreenById("resultScreen");
    }

    // ===== XATOLAR TAHLILI =====
    function showScreenById(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showMistakes() {
      const answers = window.battleAnswers || [];
      const list = document.getElementById("mistakesList");

      if (answers.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#64748b; padding:40px;">Ma\'lumot yo\'q</div>';
      } else {
        list.innerHTML = "";
        answers.forEach((a, index) => {
          const card = document.createElement("div");
          const borderColor = a.is_correct ? "#22c55e" : "#ef4444";
          card.style.cssText = "background:rgba(20,20,40,0.8); border:1px solid rgba(99,102,241,0.3); border-left:4px solid " + borderColor + "; border-radius:14px; padding:18px; margin-bottom:14px;";

          let optionsHtml = "";
          ["A", "B", "C", "D"].forEach(letter => {
            const text = a["option_" + letter.toLowerCase()];
            let style = "padding:8px 12px; border-radius:8px; margin:4px 0; font-size:14px;";
            if (letter === a.correct_answer) {
              style += "background:rgba(34,197,94,0.2); color:#86efac; font-weight:600;";
            } else if (letter === a.your_answer && !a.is_correct) {
              style += "background:rgba(239,68,68,0.2); color:#fca5a5;";
            } else {
              style += "color:#94a3b8;";
            }
            optionsHtml += '<div style="' + style + '">' + letter + ') ' + text + '</div>';
          });

          const statusIcon = a.is_correct ? "✅" : "❌";
          const yourAnswerText = a.your_answer ? a.your_answer : "javob berilmadi";

          card.innerHTML =
            '<div style="font-weight:600; font-size:16px; margin-bottom:10px;">' + statusIcon + ' Savol ' + (index + 1) + ': ' + a.question_text + '</div>' +
            optionsHtml +
            '<div style="font-size:13px; color:#94a3b8; margin-top:8px;">Sizning javobingiz: <b>' + yourAnswerText + '</b> · To\'g\'ri: <b style="color:#86efac;">' + a.correct_answer + '</b></div>' +
            (a.explanation ? '<div style="font-size:13px; color:#a5b4fc; margin-top:8px; padding:10px; background:rgba(99,102,241,0.1); border-radius:8px;">💡 ' + a.explanation + '</div>' : '');

          list.appendChild(card);
        });
      }

      showScreenById("mistakesScreen");
    }

    function backToResult() {
      showScreenById("resultScreen");
    }

    // ===== KONFETTI EFFEKTI =====
    function launchConfetti() {
      const colors = ["#6366f1", "#a855f7", "#fbbf24", "#22c55e", "#f87171", "#60a5fa"];
      const count = 80;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 2) + "s";
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        // ba'zilari aylana, ba'zilari kvadrat
        if (Math.random() > 0.5) piece.style.borderRadius = "50%";
        document.body.appendChild(piece);

        // animatsiya tugagach o'chirish
        setTimeout(() => piece.remove(), 4500);
      }
    }

    // Ballarni 0 dan sanab o'stirish
    function animateScore(elementId, target, duration) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const startTime = performance.now();
      function update(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(target * eased);
        if (progress < 1) requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
    }
    
  </script>
</body>
