<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boshqaruv paneli — Knowledge Arena</title>
  <style>
    :root {
      --bg-main: #070b18;
      --bg-card: #10172a;
      --bg-input: #0b1322;
      --bg-soft: #0e1526;
      --border: #1e2a44;
      --border-focus: #3b82f6;
      --primary: #3b82f6;
      --secondary: #8b5cf6;
      --accent: #22d3ee;
      --gold: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 12% 40%, rgba(59,130,246,0.14), transparent 38%),
        radial-gradient(circle at 88% 25%, rgba(139,92,246,0.14), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(34,211,238,0.06), transparent 45%);
    }
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #fff;
      box-shadow: 0 4px 14px rgba(59,130,246,0.4);
    }
    .logo-name { font-size: 19px; font-weight: 700; }
    .logout-btn {
      display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-muted);
      font-size: 14px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .logout-btn:hover { border-color: var(--border-focus); color: var(--text-main); }
    .logout-btn svg { width: 16px; height: 16px; }

    .main {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px;
    }
    .panel {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 48px 44px;
      width: 100%; max-width: 560px; text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
    }
    .role-badge-icon {
      width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 10px 36px rgba(59,130,246,0.45);
    }
    .role-badge-icon svg { width: 40px; height: 40px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .role-name {
      display: inline-block; margin-bottom: 20px; padding: 5px 14px;
      background: rgba(59,130,246,0.12); color: var(--accent);
      border: 1px solid var(--border); border-radius: 999px;
      font-size: 13px; font-weight: 600;
    }
    .desc { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .soon-box {
      background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 18px; margin-bottom: 28px;
      display: flex; align-items: center; gap: 12px; text-align: left;
    }
    .soon-icon {
      flex: 0 0 auto; width: 42px; height: 42px; border-radius: 11px;
      background: var(--bg-input); display: flex; align-items: center; justify-content: center;
      color: var(--gold);
    }
    .soon-icon svg { width: 22px; height: 22px; }
    .soon-text b { display: block; font-size: 14px; margin-bottom: 3px; }
    .soon-text span { font-size: 13px; color: var(--text-muted); }
    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, var(--primary), var(--secondary));
      border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.93; }

    .site-footer {
      display: flex; align-items: center; justify-content: center;
      padding: 16px 32px; border-top: 1px solid var(--border);
      font-size: 13px; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <div class="logo-mark">KA</div>
      <div class="logo-name">Knowledge Arena</div>
    </div>
    <button class="logout-btn" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Chiqish
    </button>
  </header>

  <div class="main">
    <div class="panel">
      <div class="role-badge-icon" id="roleIcon"></div>
      <h1 id="welcomeText">Xush kelibsiz!</h1>
      <div class="role-name" id="roleName">Rol</div>
      <p class="desc" id="roleDesc"></p>

      <div class="soon-box">
        <div class="soon-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="soon-text">
          <b>Bu panel tez orada tayyor bo'ladi</b>
          <span>Biz bu bo'lim ustida ishlayapmiz. Tez orada to'liq imkoniyatlar paydo bo'ladi.</span>
        </div>
      </div>

      <button class="btn" onclick="logout()">Chiqish</button>
    </div>
  </div>

  <footer class="site-footer">
    © 2025 Knowledge Arena. Barcha huquqlar himoyalangan.
  </footer>

  <script src="/api.js"></script>
  <script>
    // Foydalanuvchi ma'lumotini olamiz
    const userData = localStorage.getItem("user");
    if (!userData) {
      window.location.href = "/index.html";
    }
    const user = userData ? JSON.parse(userData) : {};

    // Rol bo'yicha matn va ikonka
    const ROLE_INFO = {
      teacher: {
        name: "O'qituvchi",
        desc: "O'qituvchi sifatida siz sinflar yaratishingiz, o'quvchilarni qo'shishingiz va ularning natijalarini kuzatishingiz mumkin bo'ladi.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
      },
      parent: {
        name: "Ota-ona",
        desc: "Ota-ona sifatida siz farzandingizning o'qish jarayonini, natijalarini va yutuqlarini kuzatib borishingiz mumkin bo'ladi.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
      },
      school_admin: {
        name: "Maktab admini",
        desc: "Maktab admini sifatida siz maktabingiz statistikasini, o'qituvchilarni va umumiy ko'rsatkichlarni boshqarishingiz mumkin bo'ladi.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>'
      }
    };

    const role = user.role || "teacher";

    // Har rolni o'z haqiqiy paneliga yo'naltirish (bu "tez orada" sahifa faqat zaxira)
    var ROLE_PANEL = {
      teacher: "/teacher.html",
      parent: "/parent.html",
      school_admin: "/school-admin.html",
      student: "/lobby.html",
    };
    if (ROLE_PANEL[role]) {
      window.location.replace(ROLE_PANEL[role]);
    }

    const info = ROLE_INFO[role] || ROLE_INFO.teacher;

    const firstName = user.first_name || "";
    document.getElementById("welcomeText").textContent = "Xush kelibsiz, " + firstName + "!";
    document.getElementById("roleName").textContent = info.name;
    document.getElementById("roleDesc").textContent = info.desc;
    document.getElementById("roleIcon").innerHTML = info.icon;

    function logout() {
      localStorage.removeItem("user");
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    }
  </script>
</body>
</html>
