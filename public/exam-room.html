<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="examRoom.metaTitle">Daraja imtihoni — IlmLiga</title>
  <meta name="description" content="IlmLiga daraja imtihonini topshiring va natijangizni ko‘ring." data-i18n-content="examRoom.metaDescription">
  <link rel="stylesheet" href="/app.css">
  <style>
    body { display: flex; align-items: flex-start; justify-content: center; padding: 30px 20px; }
    .exam-wrap { max-width: 820px; width: 100%; }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== INTRO ===== */
    .intro-card { padding: 0; overflow: hidden; }
    .intro-top { padding: 32px; text-align: center; background: linear-gradient(135deg, rgba(91,140,255,0.18), rgba(168,85,247,0.12)); }
    .intro-ic { width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; box-shadow: 0 0 30px rgba(91,140,255,0.4); }
    .intro-ic i { width: 38px; height: 38px; color: #fff; }
    .intro-top h1 { font-size: 26px; font-weight: 800; }
    .intro-top p { font-size: 14px; color: var(--text-dim); margin-top: 6px; }
    .intro-body { padding: 28px 32px; }
    .rules-title { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .rule-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .rule-row:last-child { border-bottom: none; }
    .rule-row i { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }
    .intro-actions { display: flex; gap: 12px; margin-top: 24px; }
    .not-eligible { margin-top: 20px; }
    .ne-box { padding: 20px; border-radius: 14px; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); }
    .ne-title { font-weight: 700; color: var(--red); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .ne-req { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
    .ne-req i { width: 16px; height: 16px; }
    .ne-ok { color: var(--green); }
    .ne-no { color: var(--text-dim); }

    /* ===== IMTIHON ===== */
    .exam-status { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .es-prog-text { font-size: 14px; font-weight: 600; color: var(--text-dim); }
    .es-timer { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; color: var(--gold); }
    .es-timer i { width: 18px; height: 18px; }
    .es-timer.warning { color: var(--red); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .prog-bar { height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.3s; }

    .q-card { padding: 32px; }
    .q-skill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; background: rgba(91,140,255,0.15); border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 18px; text-transform: capitalize; }
    .q-skill i { width: 13px; height: 13px; }
    .q-text { font-size: 22px; font-weight: 600; line-height: 1.4; margin-bottom: 28px; }
    .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin: 12px 0; padding: 18px 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 16px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .opt:hover { border-color: var(--border-bright); transform: translateX(4px); }
    .opt.selected { background: rgba(91,140,255,0.15); border-color: var(--accent); }
    .opt-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-bright); flex-shrink: 0; display: grid; place-items: center; transition: all 0.2s; }
    .opt.selected .opt-radio { border-color: var(--accent); }
    .opt.selected .opt-radio::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
    .opt-letter { font-weight: 800; color: var(--text-dim); width: 20px; flex-shrink: 0; }
    .opt.selected .opt-letter { color: var(--accent); }
    .q-nav { display: flex; justify-content: flex-end; margin-top: 24px; }

    /* ===== NATIJA ===== */
    .result-card { padding: 40px; text-align: center; }
    .result-ic { width: 90px; height: 90px; border-radius: 26px; margin: 0 auto 20px; display: grid; place-items: center; }
    .result-ic i { width: 46px; height: 46px; }
    .result-ic.pass { background: rgba(52,211,153,0.15); color: var(--green); box-shadow: 0 0 40px rgba(52,211,153,0.25); }
    .result-ic.fail { background: rgba(251,191,36,0.12); color: var(--gold); }
    .result-card h1 { font-size: 30px; font-weight: 800; }
    .result-sub { font-size: 15px; color: var(--text-dim); margin-top: 8px; }
    .result-score-big { font-size: 52px; font-weight: 800; margin: 20px 0; }
    .result-score-big.pass { color: var(--green); }
    .result-score-big.fail { color: var(--gold); }
    .skill-bd { text-align: left; margin: 24px 0; }
    .skill-bd-title { font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .skill-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
    .skill-name { font-weight: 600; text-transform: capitalize; display: flex; align-items: center; gap: 8px; }
    .skill-name i { width: 16px; height: 16px; }
    .skill-val { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .skill-val.pass { color: var(--green); }
    .skill-val.fail { color: var(--red); }
    .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  </style>

  <link rel="stylesheet" href="responsive.css">

</head>
<body>
  <div class="exam-wrap">

    <!-- INTRO -->
    <div class="screen active" id="introScreen">
      <div class="card intro-card">
        <div class="intro-top">
          <div class="intro-ic"><i data-lucide="graduation-cap"></i></div>
          <h1 id="examTitle" data-i18n="examRoom.levelExam">Daraja imtihoni</h1>
          <p id="examSubtitle" data-i18n="examRoom.defaultTransition">Keyingi darajaga ko‘tarilish imtihoni</p>
        </div>
        <div class="intro-body">
          <div class="rules-title" data-i18n="examRoom.rules">Qoidalar</div>
          <div class="rule-row"><i data-lucide="list-checks"></i> <span data-i18n="examRoom.ruleQuestions">20 ta savol (aralash mavzular)</span></div>
          <div class="rule-row"><i data-lucide="clock"></i> <span data-i18n="examRoom.ruleTime">Har savolga 30 soniya</span></div>
          <div class="rule-row"><i data-lucide="target"></i> <span data-i18n="examRoom.ruleOverall">O‘tish uchun: umumiy 75%+</span></div>
          <div class="rule-row"><i data-lucide="layers"></i> <span data-i18n="examRoom.ruleTopic">Har mavzu bo‘yicha kamida 60%</span></div>
          <div class="rule-row"><i data-lucide="user"></i> <span data-i18n="examRoom.ruleSolo">Raqib yo‘q — yolg‘iz topshirasiz</span></div>
          <div id="introButtons" class="intro-actions">
            <button class="btn btn-primary" onclick="startExam()"><i data-lucide="play" style="width:18px;height:18px;"></i> <span data-i18n="examRoom.start">Imtihonni boshlash</span></button>
            <button class="btn btn-ghost" onclick="goExam()" data-i18n="examRoom.cancel">Bekor qilish</button>
          </div>
          <div id="notEligible" class="not-eligible" style="display:none;"></div>
        </div>
      </div>
    </div>

    <!-- IMTIHON -->
    <div class="screen" id="examScreen">
      <div class="exam-status">
        <span class="es-prog-text" id="progressText">Savol 1 / 20</span>
        <span class="es-timer" id="timer"><i data-lucide="clock"></i> <span id="timerText">0:30</span></span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progressFill" style="width:5%;"></div></div>
      <div class="card q-card">
        <span class="q-skill" id="qSkill"><i data-lucide="book-open"></i> <span id="qSkillText">grammar</span></span>
        <div class="q-text" id="qText">...</div>
        <div id="options"></div>
        <div class="q-nav">
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()"><span data-i18n="examRoom.next">Keyingi</span> <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
    </div>

    <!-- NATIJA -->
    <div class="screen" id="resultScreen">
      <div class="card result-card">
        <div class="result-ic" id="resultIc"><i data-lucide="trophy"></i></div>
        <h1 id="resultTitle" data-i18n="examRoom.congratulations">Tabriklaymiz!</h1>
        <p class="result-sub" id="resultSubtitle"></p>
        <div class="result-score-big" id="overallScore">0%</div>
        <div class="skill-bd">
          <div class="skill-bd-title" data-i18n="examRoom.topicResults">Mavzular bo‘yicha natija</div>
          <div id="skillBreakdown"></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="goExam()"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i> <span data-i18n="examRoom.examCenter">Imtihon markazi</span></button>
          <button class="btn btn-ghost" id="retryBtn" onclick="location.reload()" style="display:none;"><i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i> <span data-i18n="examRoom.retry">Qayta urinish</span></button>
        </div>
      </div>
    </div>

  </div>

  <script src="/api.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/i18n.js"></script>
  <script>
    function roomT(key, params) {
      return window.IlmLigaI18n ? window.IlmLigaI18n.t(key, params) : key;
    }

    const userData = localStorage.getItem("user");
    if (!userData) window.location.href = "/index.html";
    const user = JSON.parse(userData);

    let questions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let timerInterval = null;
    let examSessionId = null;
    let latestStatus = null;
    let latestResult = null;

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      lucide.createIcons();
    }

    function localizedSkill(skill) {
      const normalized = String(skill || "").trim().toLowerCase();
      const keys = {
        grammar: "examRoom.skillGrammar",
        vocabulary: "examRoom.skillVocabulary",
        reading: "examRoom.skillReading",
        listening: "examRoom.skillListening",
        writing: "examRoom.skillWriting",
      };
      return keys[normalized] ? roomT(keys[normalized]) : (skill || roomT("examRoom.questionFallback"));
    }

    function localizedStartError(error) {
      const keys = {
        "Noto'g'ri ID": "examRoom.invalidId",
        "Ruxsat yo'q": "examRoom.forbidden",
        "Foydalanuvchi topilmadi": "examRoom.userNotFound",
        "Imtihon uchun yetarli savol yo'q (kamida 10 ta kerak)": "examRoom.insufficientQuestions",
        "Server xatosi": "examRoom.serverError",
      };
      return keys[error] ? roomT(keys[error]) : (error || roomT("examRoom.genericError"));
    }

    function renderStatus(data) {
      document.getElementById("examTitle").textContent = roomT("examRoom.levelExam");
      document.getElementById("examSubtitle").textContent = data.next_level
        ? roomT("examRoom.transition", { current: data.current_level, next: data.next_level })
        : roomT("examRoom.defaultTransition");

      const buttons = document.getElementById("introButtons");
      const notEl = document.getElementById("notEligible");
      buttons.style.display = data.eligible ? "flex" : "none";
      notEl.style.display = data.eligible ? "none" : "block";
      if (data.eligible) return;

      if (!data.next_level) {
        notEl.innerHTML = '<div class="ne-box"><div class="ne-title"><i data-lucide="info"></i> ' + roomT("examRoom.highestLevel") + '</div></div>' +
          '<button class="btn btn-ghost" style="margin-top:16px;" onclick="goExam()">' + roomT("examRoom.examCenter") + '</button>';
      } else {
        const p = data.progress;
        const bOk = p.battles >= p.battles_required;
        const aOk = p.accuracy >= p.accuracy_required;
        notEl.innerHTML =
          '<div class="ne-box"><div class="ne-title"><i data-lucide="lock"></i> ' + roomT("examRoom.locked") + '</div>' +
            '<div class="ne-req ' + (bOk ? "ne-ok" : "ne-no") + '"><i data-lucide="' + (bOk ? "check-circle" : "circle") + '"></i> ' + roomT("examRoom.battlesRequirement", { current: p.battles, required: p.battles_required }) + '</div>' +
            '<div class="ne-req ' + (aOk ? "ne-ok" : "ne-no") + '"><i data-lucide="' + (aOk ? "check-circle" : "circle") + '"></i> ' + roomT("examRoom.accuracyRequirement", { current: p.accuracy, required: p.accuracy_required }) + '</div>' +
          '</div>' +
          '<button class="btn btn-ghost" style="margin-top:16px;" onclick="goExam()">' + roomT("examRoom.examCenter") + '</button>';
      }
      lucide.createIcons();
    }

    async function checkStatus() {
      try {
        const res = await authFetch("/exam/status/" + user.id);
        const data = await res.json();
        latestStatus = data;
        renderStatus(data);
      } catch (err) { console.error("Status xatosi"); }
    }

    async function startExam() {
      try {
        const res = await authFetch("/exam/start/" + user.id);
        const data = await res.json();
        if (!res.ok) { alert(localizedStartError(data.error)); return; }
        questions = data.questions;
        examSessionId = data.session_id || null;
        currentIndex = 0;
        userAnswers = {};
        showScreen("examScreen");
        showQuestion();
      } catch (err) { alert(roomT("examRoom.serverError")); }
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function showQuestion() {
      const q = questions[currentIndex];
      document.getElementById("progressFill").style.width = ((currentIndex + 1) / questions.length * 100) + "%";
      document.getElementById("qText").textContent = q.question_text;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      ["A","B","C","D"].forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "opt" + (userAnswers[q.id] === letter ? " selected" : "");
        btn.innerHTML = '<span class="opt-radio"></span><span class="opt-letter">' + letter + '</span><span>' + escapeHtml(q["option_" + letter.toLowerCase()] || "") + '</span>';
        btn.onclick = () => selectAnswer(q.id, letter, btn);
        optionsDiv.appendChild(btn);
      });

      renderQuestionLabels();
      lucide.createIcons();
      startTimer();
    }

    function renderQuestionLabels() {
      const q = questions[currentIndex];
      if (!q) return;
      document.getElementById("progressText").textContent = roomT("examRoom.questionProgress", {
        current: currentIndex + 1,
        total: questions.length,
      });
      document.getElementById("qSkillText").textContent = localizedSkill(q.skill);
      document.getElementById("nextBtn").innerHTML = currentIndex === questions.length - 1
        ? roomT("examRoom.finish") + ' <i data-lucide="check" style="width:16px;height:16px;"></i>'
        : roomT("examRoom.next") + ' <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>';
    }

    function selectAnswer(qId, letter, btn) {
      userAnswers[qId] = letter;
      document.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
      btn.classList.add("selected");
    }

    function startTimer() {
      clearInterval(timerInterval);
      let timeLeft = 30;
      const timerEl = document.getElementById("timer");
      timerEl.classList.remove("warning");
      updateTimerDisplay(timeLeft);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 10) timerEl.classList.add("warning");
        if (timeLeft <= 0) { clearInterval(timerInterval); nextQuestion(); }
      }, 1000);
    }

    function updateTimerDisplay(sec) {
      document.getElementById("timerText").textContent = "0:" + (sec < 10 ? "0" + sec : sec);
    }

    function nextQuestion() {
      clearInterval(timerInterval);
      if (currentIndex < questions.length - 1) { currentIndex++; showQuestion(); }
      else { finishExam(); }
    }

    async function finishExam() {
      clearInterval(timerInterval);
      const answersArr = questions.map(q => ({ question_id: q.id, answer: userAnswers[q.id] || null }));
      try {
        const res = await authFetch("/exam/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: examSessionId, answers: answersArr }),
        });
        const data = await res.json();
        showResult(data);
      } catch (err) { alert(roomT("examRoom.serverError")); }
    }

    function showResult(data) {
      latestResult = data;
      if (data.updated_user) localStorage.setItem("user", JSON.stringify(data.updated_user));

      const ic = document.getElementById("resultIc");
      const title = document.getElementById("resultTitle");
      const subtitle = document.getElementById("resultSubtitle");
      const scoreBig = document.getElementById("overallScore");

      if (data.passed) {
        ic.className = "result-ic pass";
        ic.innerHTML = '<i data-lucide="party-popper"></i>';
        title.textContent = roomT("examRoom.congratulations");
        subtitle.innerHTML = roomT("examRoom.promoted", { level: "<b>" + escapeHtml(data.new_level) + "</b>" });
        scoreBig.className = "result-score-big pass";
        document.getElementById("retryBtn").style.display = "none";
      } else {
        ic.className = "result-ic fail";
        ic.innerHTML = '<i data-lucide="book-open"></i>';
        title.textContent = roomT("examRoom.tryAgain");
        subtitle.textContent = roomT("examRoom.failedSubtitle");
        scoreBig.className = "result-score-big fail";
        document.getElementById("retryBtn").style.display = "inline-flex";
      }

      scoreBig.textContent = data.overall_percent + "% (" + data.total_correct + "/" + data.total + ")";

      const breakdown = document.getElementById("skillBreakdown");
      breakdown.innerHTML = "";
      for (const skill in data.skill_results) {
        const s = data.skill_results[skill];
        const passed = s.percent >= data.pass_skill_required;
        breakdown.innerHTML +=
          '<div class="skill-row">' +
            '<span class="skill-name"><i data-lucide="' + (passed ? "check-circle" : "x-circle") + '"></i> ' + escapeHtml(localizedSkill(skill)) + '</span>' +
            '<span class="skill-val ' + (passed ? "pass" : "fail") + '">' + s.correct + '/' + s.total + ' (' + s.percent + '%)</span>' +
          '</div>';
      }

      showScreen("resultScreen");
    }

    function goExam() { window.location.href = "/exam.html"; }

    window.addEventListener("ilmliga:languagechange", function () {
      if (latestStatus) renderStatus(latestStatus);
      if (questions.length) renderQuestionLabels();
      if (latestResult) showResult(latestResult);
      lucide.createIcons();
    });

    checkStatus();
    lucide.createIcons();
  </script>
</body>
</html>
