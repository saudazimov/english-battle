<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Battle — Kirish</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15), transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      padding: 20px;
    }

    .card {
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .logo p {
      color: #64748b;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      color: #94a3b8;
      transition: all 0.3s;
      font-weight: 600;
    }

    .tab.active {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .form { display: none; }
    .form.active { display: block; }

    .input-group { margin-bottom: 16px; }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .row { display: flex; gap: 12px; }
    .row .input-group { flex: 1; }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>⚔️ ENGLISH BATTLE</h1>
      <p>Compete. Learn. Become the Best.</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="switchTab('login')">Kirish</div>
      <div class="tab" id="registerTab" onclick="switchTab('register')">Ro'yxatdan o'tish</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form active" id="loginForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="ali@test.com">
      </div>
      <div class="input-group">
        <label>Parol</label>
        <input type="password" id="loginPassword" placeholder="••••••">
      </div>
      <button class="btn" onclick="login()">Kirish</button>
    </div>

    <!-- REGISTER FORM -->
    <div class="form" id="registerForm">
      <div class="row">
        <div class="input-group">
          <label>Ism</label>
          <input type="text" id="regFirstName" placeholder="Ali">
        </div>
        <div class="input-group">
          <label>Familiya</label>
          <input type="text" id="regLastName" placeholder="Valiyev">
        </div>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="ali@test.com">
      </div>
      <div class="input-group">
        <label>Parol</label>
        <input type="password" id="regPassword" placeholder="••••••">
      </div>
      <button class="btn" onclick="register()">Ro'yxatdan o'tish</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById("loginTab").classList.toggle("active", tab === "login");
      document.getElementById("registerTab").classList.toggle("active", tab === "register");
      document.getElementById("loginForm").classList.toggle("active", tab === "login");
      document.getElementById("registerForm").classList.toggle("active", tab === "register");
      hideMessage();
    }

    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message " + type;
    }

    function hideMessage() {
      document.getElementById("message").className = "message";
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        return showMessage("Email va parolni kiriting", "error");
      }

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          return showMessage(data.error || "Xato yuz berdi", "error");
        }

        // Foydalanuvchini saqlash va lobbyga o'tish
        localStorage.setItem("user", JSON.stringify(data.user));
        showMessage("Muvaffaqiyatli! Yo'naltirilmoqda...", "success");
        setTimeout(() => { window.location.href = "/lobby.html"; }, 800);
      } catch (err) {
        showMessage("Server bilan aloqa yo'q", "error");
      }
    }

    async function register() {
      const first_name = document.getElementById("regFirstName").value;
      const last_name = document.getElementById("regLastName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;

      if (!first_name || !last_name || !email || !password) {
        return showMessage("Barcha maydonlarni to'ldiring", "error");
      }

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ first_name, last_name, email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          return showMessage(data.error || "Xato yuz berdi", "error");
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        showMessage("Ro'yxatdan o'tdingiz! Yo'naltirilmoqda...", "success");
        setTimeout(() => { window.location.href = "/lobby.html"; }, 800);
      } catch (err) {
        showMessage("Server bilan aloqa yo'q", "error");
      }
    }
  </script>
</body>
</html>
